<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MusicNojo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>MusicNojo</h1>
    <button id="open-collection">Open Collection…</button>
    <input id="search" type="search" placeholder="Search by title or artist…" autofocus />
    <span id="count"></span>
  </header>
  <div id="main">
    <table id="albums">
      <thead>
        <tr>
          <th data-k="title">Title</th>
          <th data-k="artists">Artist(s)</th>
          <th data-k="genres">Genre(s)</th>
          <th data-k="format">Format</th>
          <th data-k="release_year">Year</th>
          <th data-k="track_count">Tracks</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <aside id="detail" hidden>
      <button id="detail-close" aria-label="Close">×</button>
      <div id="detail-content"></div>
    </aside>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
