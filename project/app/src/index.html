<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MusicNojo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>MusicNojo</h1>
    <input id="search" type="search" data-i18n-placeholder="search_placeholder" placeholder="Search by title or artist…" autofocus />
    <span id="count"></span>
    <span id="file-badge"></span>
    <span id="app-version">MusicNojo</span>
    <button id="open-collection" data-i18n="nav_open">Open Collection…</button>
    <button id="add-album" data-i18n="nav_add">Add Album…</button>
    <button id="stats-btn" data-i18n="nav_stats">📊 Statistics</button>
  </header>
  <div id="tabs"></div>
  <main id="main">
    <aside id="groups">
      <select id="group-field">
        <option value="artists" data-i18n="opt_group_artists">Artist</option>
        <option value="genres" data-i18n="opt_group_genres">Genre</option>
        <option value="format" data-i18n="opt_group_format">Format</option>
        <option value="country" data-i18n="opt_group_country">Country</option>
        <option value="label" data-i18n="opt_group_label">Label</option>
      </select>
      <div id="azbar"></div>
      <div id="group-list"></div>
    </aside>
    <div id="splitter-v" title="Drag to resize"></div>
    <div id="right-col">
      <div id="list-pane">
        <div id="list-toolbar">
          <select id="sort">
            <option value="title" data-i18n="opt_sort_title">Title (A→Z)</option>
            <option value="artist" data-i18n="opt_sort_artist">Artist (A→Z)</option>
            <option value="year_desc" data-i18n="opt_sort_year_desc">Year (newest first)</option>
            <option value="label" data-i18n="opt_sort_label">Label (A→Z)</option>
            <option value="date_added_desc" data-i18n="opt_sort_date_added">Date added (newest first)</option>
          </select>
          <div id="view-toggle">
            <button id="view-list" class="active" data-i18n="list_view_list">☰ List</button>
            <button id="view-grid" data-i18n="list_view_grid">▦ Grid</button>
          </div>
        </div>
        <table id="albums">
          <thead>
            <tr>
              <th data-k="title" data-i18n="col_title">Title</th>
              <th data-k="artists" data-i18n="col_artists">Artist(s)</th>
              <th data-k="genres" data-i18n="col_genres">Genre(s)</th>
              <th data-k="format" data-i18n="col_format">Format</th>
              <th data-k="release_year" data-i18n="col_year">Year</th>
              <th data-k="track_count" data-i18n="col_tracks">Tracks</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div id="grid-view"></div>
        <div id="pager">
          <button id="prev-page" data-i18n="list_prev">‹ Prev.</button>
          <span id="page-info"></span>
          <button id="next-page" data-i18n="list_next">Next ›</button>
        </div>
      </div>
      <div id="splitter-h" title="Drag to resize"></div>
      <aside id="detail">
        <div id="detail-content"><p id="detail-empty" data-i18n="detail_select">Select an album.</p></div>
        <div id="detail-actions" hidden>
          <button id="detail-edit" data-i18n="detail_edit">Edit…</button>
          <button id="detail-delete" data-i18n="detail_delete">Delete…</button>
        </div>
      </aside>
    </div>
  </main>
  <div id="stats-pane"></div>

  <dialog id="album-form-dialog">
    <form id="album-form" method="dialog">
      <h2 id="album-form-title">Add Album</h2>
      <label><span data-i18n="form_label_title">Title</span> <input name="title" required /></label>
      <label><span data-i18n="form_label_artists">Artist(s), comma-separated</span> <input name="artists" /></label>
      <label><span data-i18n="form_label_composers">Composer(s)</span> <input name="composers" /></label>
      <label><span data-i18n="form_label_conductors">Conductor(s)</span> <input name="conductors" /></label>
      <label><span data-i18n="form_label_musicians">Musician(s)</span> <input name="musicians" /></label>
      <label><span data-i18n="form_label_orchestras">Orchestra(s)</span> <input name="orchestras" /></label>
      <label><span data-i18n="form_label_choruses">Chorus(es)</span> <input name="choruses" /></label>
      <label><span data-i18n="form_label_genres">Genre(s)</span> <input name="genres" /></label>
      <label><span data-i18n="form_label_tags">Tag(s)</span> <input name="tags" /></label>
      <label><span data-i18n="form_label_extras">Extra(s)</span> <input name="extras" /></label>
      <label><span data-i18n="form_label_studios">Studio(s)</span> <input name="studios" /></label>
      <div class="row">
        <label><span data-i18n="form_label_format">Format</span> <input name="format" /></label>
        <label><span data-i18n="form_label_label">Label</span> <input name="label" /></label>
        <label><span data-i18n="form_label_country">Country</span> <input name="country" /></label>
      </div>
      <div class="row">
        <label><span data-i18n="form_label_year">Year</span> <input name="release_year" /></label>
        <label><span data-i18n="form_label_rating">Rating</span> <input name="rating" type="number" min="0" max="5" /></label>
        <label><span data-i18n="form_label_upc">UPC</span> <input name="upc" /></label>
      </div>
      <label><span data-i18n="form_label_notes">Notes</span> <textarea name="notes" rows="2"></textarea></label>
      <label><span data-i18n="form_label_tracks">Tracks, one per line</span>
        <textarea name="tracks" rows="4" data-i18n-placeholder="form_tracks_placeholder" placeholder="One track title per line"></textarea>
      </label>
      <div id="album-form-error" class="error"></div>
      <menu>
        <button type="button" id="album-form-cancel" data-i18n="form_cancel">Cancel</button>
        <button type="submit" id="album-form-submit" data-i18n="form_save">Save</button>
      </menu>
    </form>
  </dialog>

  <dialog id="add-preview-dialog">
    <h2 id="add-preview-title"></h2>
    <p id="add-preview-collection"></p>
    <p id="add-preview-summary"></p>
    <ul id="add-preview-list"></ul>
    <menu>
      <button type="button" id="add-preview-cancel" data-i18n="form_cancel">Cancel</button>
      <button type="button" id="add-preview-confirm" data-i18n="add_preview_confirm">Confirm and add</button>
    </menu>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
