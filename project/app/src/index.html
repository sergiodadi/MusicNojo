<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MusicNojo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>MusicNojo</h1>
    <button id="open-collection">Open Collection…</button>
    <button id="add-album">Add Album…</button>
    <input id="search" type="search" placeholder="Search by title or artist…" autofocus />
    <span id="count"></span>
  </header>
  <div id="main">
    <table id="albums">
      <thead>
        <tr>
          <th data-k="title">Title</th>
          <th data-k="artists">Artist(s)</th>
          <th data-k="genres">Genre(s)</th>
          <th data-k="format">Format</th>
          <th data-k="release_year">Year</th>
          <th data-k="track_count">Tracks</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <aside id="detail" hidden>
      <button id="detail-close" aria-label="Close">×</button>
      <div id="detail-content"></div>
      <div id="detail-actions">
        <button id="detail-edit">Edit…</button>
        <button id="detail-delete">Delete…</button>
      </div>
    </aside>
  </div>

  <dialog id="album-form-dialog">
    <form id="album-form" method="dialog">
      <h2 id="album-form-title">Add Album</h2>
      <label>Title <input name="title" required /></label>
      <label>Artist(s), comma-separated <input name="artists" /></label>
      <label>Composer(s) <input name="composers" /></label>
      <label>Conductor(s) <input name="conductors" /></label>
      <label>Musician(s) <input name="musicians" /></label>
      <label>Orchestra(s) <input name="orchestras" /></label>
      <label>Chorus(es) <input name="choruses" /></label>
      <label>Genre(s) <input name="genres" /></label>
      <label>Tag(s) <input name="tags" /></label>
      <label>Extra(s) <input name="extras" /></label>
      <label>Studio(s) <input name="studios" /></label>
      <div class="row">
        <label>Format <input name="format" /></label>
        <label>Label <input name="label" /></label>
        <label>Country <input name="country" /></label>
      </div>
      <div class="row">
        <label>Year <input name="release_year" /></label>
        <label>Rating <input name="rating" type="number" min="0" max="5" /></label>
        <label>UPC <input name="upc" /></label>
      </div>
      <label>Notes <textarea name="notes" rows="2"></textarea></label>
      <label>Tracks, one per line
        <textarea name="tracks" rows="4" placeholder="One track title per line"></textarea>
      </label>
      <div id="album-form-error" class="error"></div>
      <menu>
        <button type="button" id="album-form-cancel">Cancel</button>
        <button type="submit" id="album-form-submit">Save</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
