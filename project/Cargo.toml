[package]
name = "music_collector_export"
version = "0.65.0"
edition = "2021"
license = "MIT"

[lib]
name = "music_collector_export"
path = "src/lib.rs"

[[bin]]
name = "mc_export"
path = "src/main.rs"

[[bin]]
name = "mc_add"
path = "src/bin/mc_add.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Blocking client (not async): the rest of this crate (rusqlite, every CLI
# command) is already fully synchronous — same reasoning as BookNojo's
# own online_search.rs.
reqwest = { version = "0.12", features = ["blocking", "json"] }

[dev-dependencies]
# Only for examples/generate_sample_collection.rs's placeholder covers
# (synthetic color + simple shapes + the album's own title/artist text,
# never real artwork) — not needed by the actual CLI tools.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
imageproc = "0.25"
ab_glyph = "0.2"
