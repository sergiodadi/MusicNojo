[package]
name = "music_collector_export"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "mc_export"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
